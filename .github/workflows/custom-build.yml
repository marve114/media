name: Custom FFmpeg Build

on:
  workflow_dispatch: # Allows you to run this workflow manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout stable Media3 version
        run: git checkout 1.3.1

      - name: Set up Android NDK
        uses: android-actions/setup-ndk@v1 # <-- CORRECTED ACTION
        with:
          ndk-version: r25c

      - name: Customize FFmpeg build script
        run: |
          cat > extensions/ffmpeg/src/main/jni/build_ffmpeg.sh << 'EOF'
          #!/bin/bash
          set -eu

          NDK_PATH=""
          FFMPEG_VERSION="4.4"
          FFMPEG_TARBALL_URL="https://ffmpeg.org/releases/ffmpeg-4.4.tar.bz2"
          FFMPEG_TARBALL_FILENAME="ffmpeg-4.4.tar.bz2"
          FFMPEG_FOLDER_NAME="ffmpeg-4.4"
          HOST_PLATFORM="linux-x86_64"

          ENABLED_DECODERS=(
              "hevc"
              "eac3"
              "truehd"
              "ac3"
              "aac"
              "hevc"
              "aac"
              "ac3"
              "eac3"
              "matroska"
              "mov"
              "mp4"
          )

          FFMPEG_MODULE_LIST=(
              "${ENABLED_DECODERS[@]/#/--enable-decoder=}"
              "${ENABLED_DECODERS[@]/#/--enable-parser=}"
              "--enable-demuxer=matroska"
              "--enable-demuxer=mov"
              "--enable-demuxer=mp4"
              "--enable-protocol=file"
          )
          ABIS=("armeabi-v7a" "arm64-v8a" "x86" "x86_64")
          MIN_API_LEVEL_ARM_V7A=19
          MIN_API_LEVEL_OTHERS=21
          JOBS="$(nproc 2> /dev/null || sysctl -n hw.ncpu 2> /dev/null || echo 4)"
          echo "Using $JOBS jobs for make"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then NDK_PATH=$ANDROID_NDK_HOME; fi
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then echo "NDK_PATH is not set."; exit 1; fi

          FFMPEG_TARBALL_PATH="$(pwd)/${FFMPEG_TARBALL_FILENAME}"
          if [ ! -f "$FFMPEG_TARBALL_PATH" ]; then echo "Downloading FFmpeg..."; wget -O "$FFMPEG_TARBALL_PATH" "$FFMPEG_TARBALL_URL"; fi
          if [ ! -d "$FFMPEG_FOLDER_NAME" ]; then echo "Extracting FFmpeg..."; tar -xvf "$FFMPEG_TARBALL_PATH"; fi

          COMMON_OPTIONS="
              --target-os=android --enable-cross-compile --enable-static --disable-shared --disable-doc
              --disable-programs --disable-everything --disable-avdevice --disable-postproc --disable-avfilter
              --disable-symver --enable-swresample --extra-ldexeflags=-pie --disable-vulkan"

          for abi in "${ABIS[@]}"; do
            if [ "$abi" == "armeabi-v7a" ]; then MIN_API_LEVEL=${MIN_API_LEVEL_ARM_V7A}; else MIN_API_LEVEL=${MIN_API_LEVEL_OTHERS}; fi
            TOOLCHAIN="${NDK_PATH}/toolchains/llvm/prebuilt/${HOST_PLATFORM}"
            C_FLAGS=""; LD_FLAGS=""
            case "$abi" in
              "armeabi-v7a") ARCH="arm"; CPU="armv7-a"; C_FLAGS="-march=armv7-a -mfloat-abi=softfp -mfpu=neon"; LD_FLAGS="-Wl,--fix-cortex-a8"; TOOLCHAIN_PREFIX="${TOOLCHAIN}/bin/armv7a-linux-androideabi";;
              "arm64-v8a") ARCH="aarch64"; CPU="armv8-a"; TOOLCHAIN_PREFIX="${TOOLCHAIN}/bin/aarch64-linux-android";;
              "x86") ARCH="x86"; CPU="i686"; COMMON_OPTIONS="$COMMON_OPTIONS --disable-asm"; TOOLCHAIN_PREFIX="${TOOLCHAIN}/bin/i686-linux-android";;
              "x86_64") ARCH="x86_64"; CPU="x86-64"; SYSROOT="${NDK_PATH}/toolchains/llvm/prebuilt/${HOST_PLATFORM}/sysroot"; C_FLAGS="-D__ANDROID_API__=${MIN_API_LEVEL} --sysroot=${SYSROOT}"; TOOLCHAIN_PREFIX="${TOOLCHAIN}/bin/x86_64-linux-android";;
              *) echo "Unsupported ABI: $abi"; exit 1;;
            esac
            PREFIX="$(pwd)/ffmpeg_build/$abi"; C_FLAGS="$C_FLAGS -O2 -g -fPIC"
            echo "Building FFmpeg for $abi..."
            cd "$FFMPEG_FOLDER_NAME"
            ./configure --prefix="$PREFIX" --libdir="$PREFIX" --arch="$ARCH" --cpu="$CPU" \
                --cc="${TOOLCHAIN_PREFIX}${MIN_API_LEVEL}-clang" --cxx="${TOOLCHAIN_PREFIX}${MIN_API_LEVEL}-clang++" \
                --nm="${TOOLCHAIN}/bin/llvm-nm" --ar="${TOOLCHAIN}/bin/llvm-ar" --ranlib="${TOOLCHAIN}/bin/llvm-ranlib" --strip="${TOOLCHAIN}/bin/llvm-strip" \
                --extra-cflags="$C_FLAGS" --extra-ldflags="$LD_FLAGS" ${COMMON_OPTIONS} "${FFMPEG_MODULE_LIST[@]}"
            make -j$JOBS && make install
            cd ..
          done
          echo "All builds finished."
          EOF

      - name: Build AAR with Gradle
        run: ./gradlew :extension-ffmpeg:assembleRelease

      - name: Upload AAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-aar
          path: extensions/ffmpeg/build/outputs/aar/extension-ffmpeg-release.aar
